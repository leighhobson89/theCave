<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23111b28'/%3E%3Cpath d='M4 12V4h3.2c2.2 0 3.8 1.4 3.8 4s-1.6 4-3.8 4H4zm2-1.7h1c1.5 0 2.4-.8 2.4-2.3S8.5 5.7 7 5.7H6v4.6z' fill='%23eaf1ff'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div id="appShell" class="app-shell">
        <!-- Menu Container -->
        <div id="menu" class="d-flex flex-column align-items-center justify-content-center">
            <div class="menu-panel">
                <h1 id="menuTitle" class="mb-4">Askew Cave</h1>
                <div id="languageContainer" class="d-flex justify-content-center my-2">
                    <div class="col">
                        <button id="btnEnglish" class="language-flag-button mx-2" title="English" aria-label="English" data-label="English"></button>
                    </div>
                    <div class="col">
                        <button id="btnSpanish" class="language-flag-button mx-2" title="Español" aria-label="Español" data-label="Español"></button>
                    </div>
                    <div class="col">
                        <button id="btnGerman" class="language-flag-button mx-2" title="Deutsch" aria-label="Deutsch" data-label="Deutsch"></button>
                    </div>
                    <div class="col">
                        <button id="btnItalian" class="language-flag-button mx-2" title="Italiano" aria-label="Italiano" data-label="Italiano"></button>
                    </div>
                    <div class="col">
                        <button id="btnFrench" class="language-flag-button mx-2" title="Français" aria-label="Français" data-label="Français"></button>
                    </div>
                </div>
                <button id="newGame" class="menu-action-button btn btn-primary mb-2">New Game Placeholder</button>
                <button id="resumeFromMenu" class="menu-action-button btn disabled mb-2">Resume Game Placeholder</button>
                <button id="loadGame" class="menu-action-button btn btn-primary mb-2">Load Game Placeholder</button>
                <button id="saveGame" class="menu-action-button btn disabled">Save Game Placeholder</button>
            </div>
        </div>

        <div id="gameArea" class="game-area d-none">
            <div id="desktopViewport" class="desktop-viewport" aria-label="Investigation desktop viewport">
                <div id="deskParallax" class="desk-parallax"></div>

                <div id="deskWorld" class="desk-world" aria-label="Investigation workspace">
                    <div id="deskTable" class="desk-table" aria-hidden="true"></div>
                    <div id="tableLegTopLeft" class="table-leg leg-top-left" aria-hidden="true"></div>
                    <div id="tableLegTopRight" class="table-leg leg-top-right" aria-hidden="true"></div>
                    <div id="tableLegBottomLeft" class="table-leg leg-bottom-left" aria-hidden="true"></div>
                    <div id="tableLegBottomRight" class="table-leg leg-bottom-right" aria-hidden="true"></div>
                    
                    <div id="backgroundFolder" class="background-story-stack folder-one desktop-hoverable" aria-label="The Arnie Tragedy">
                        <div class="background-story-paper background-story-paper-back" aria-hidden="true"></div>
                        <div class="background-story-paper background-story-paper-mid" aria-hidden="true"></div>

                        <div class="background-story-paper background-story-paper-front" aria-hidden="true">
                            <div class="background-story-paperclip"></div>
                            <div class="background-story-text"></div>
                        </div>

                        <div id="backgroundFolderLabel" class="background-story-label">THE ARNIE TRAGEDY</div>
                    </div>

                    <div id="reportsFolder" class="desk-folder folder-green folder-two desktop-hoverable">
                        <div class="reports-paper-stack" aria-hidden="true">
                            <div class="reports-paper-sheet reports-paper-sheet-back"></div>
                            <div class="reports-paper-sheet reports-paper-sheet-mid"></div>
                            <div class="reports-paper-sheet reports-paper-sheet-front"></div>

                            <div class="magnifying-glass reports-folder-magnifier">
                                <div class="lens">
                                    <div class="lens-text"></div>
                                </div>
                                <div class="handle"></div>
                            </div>
                        </div>
                        <div class="desk-folder-tab"></div>
                        <div id="reportsFolderLabel" class="desk-folder-label">REPORTS</div>
                    </div>

                    <div id="photosFolder" class="desk-folder folder-blue folder-three desktop-hoverable">
                        <div class="photos-paper-stack" aria-hidden="true">
                            <div class="photos-paper-sheet photos-paper-sheet-back"></div>
                            <div class="photos-paper-sheet photos-paper-sheet-mid"></div>
                            <div class="photos-paper-sheet photos-paper-sheet-front">
                                <img class="photos-stack-preview" src="./assets/photos/caveEntrance.png" alt="" />
                            </div>
                        </div>
                        <div class="desk-folder-tab"></div>
                        <div id="photosFolderLabel" class="desk-folder-label">PHOTOS</div>
                    </div>

                    <div id="notesFolder" class="notes-folder desktop-hoverable" aria-label="Notes folder">
                        <div class="folder-tab"></div>

                        <div class="folder-body">
                            <div class="paper-stack paper-back"></div>
                            <div class="paper-stack paper-mid"></div>

                            <div class="paper-stack paper-front">
                                <div class="fake-text"></div>
                                <div class="stamp">CONFIDENTIAL</div>
                            </div>

                            <div class="notes-inkwell" aria-hidden="true">
                                <div class="notes-inkwell-opening"></div>
                            </div>

                            <div class="notes-pen" aria-hidden="true">
                                <div class="notes-pen-tip"></div>
                                <div class="notes-pen-band"></div>
                                <div class="notes-pen-cap"></div>
                                <div class="notes-pen-highlight"></div>
                            </div>

                            <div id="notesLabel" class="notes-label">NOTES</div>
                        </div>
                    </div>

                    <div id="desktopCalendar" class="desktop-calendar desktop-hoverable" aria-label="Desk calendar">
                        <div class="calendar-rings" aria-hidden="true">
                            <span></span>
                            <span></span>
                            <span></span>
                        </div>

                        <div class="calendar-stack calendar-sheet-back" aria-hidden="true"></div>
                        <div class="calendar-stack calendar-sheet-mid" aria-hidden="true"></div>

                        <div class="calendar-sheet-front" aria-hidden="true">
                            <div class="calendar-month">MAY</div>
                            <div class="calendar-day">14</div>
                            <div class="calendar-quote-lines"></div>
                        </div>
                    </div>

                    <div id="desktopAshtray" class="desktop-ashtray has-lit-cig" aria-label="Glass ashtray with lit cigarette">
                        <div class="ashtray-shadow" aria-hidden="true"></div>
                        <div class="ashtray-body" aria-hidden="true">
                            <div class="ashtray-inner"></div>
                            <div class="ashtray-groove ashtray-groove-one"></div>
                            <div class="ashtray-groove ashtray-groove-two"></div>
                            <div class="ashtray-groove ashtray-groove-three"></div>
                        </div>

                        <div class="ashtray-butt ashtray-butt-one" aria-hidden="true"></div>
                        <div class="ashtray-butt ashtray-butt-two" aria-hidden="true"></div>
                        <div class="ashtray-butt ashtray-butt-extra" aria-hidden="true"></div>

                        <div class="ashtray-lit-cigarette" aria-hidden="true">
                            <span class="lit-cig-filter"></span>
                            <span class="lit-cig-body"></span>
                            <span class="lit-cig-ash"></span>
                            <span class="lit-cig-ember"></span>
                        </div>

                        <div class="ashtray-smoke" aria-hidden="true">
                            <span class="smoke-plume plume-one"></span>
                            <span class="smoke-plume plume-two"></span>
                            <span class="smoke-plume plume-three"></span>
                            <span class="smoke-plume plume-four"></span>
                            <span class="smoke-plume plume-five"></span>
                            <span class="smoke-plume plume-six"></span>
                            <span class="smoke-plume plume-seven"></span>
                            <span class="smoke-plume plume-eight"></span>
                        </div>

                        <button
                            id="desktopAshtrayHotspot"
                            class="ashtray-click-target"
                            type="button"
                            aria-label="Stub out or relight the cigarette">
                        </button>
                    </div>

                    <div id="desktopComputerRig" class="computer-rig">
                        <div class="computer-rig-cables" aria-hidden="true">
                            <span class="computer-cable cable-one"></span>
                            <span class="computer-cable cable-two"></span>
                            <span class="computer-cable cable-three"></span>
                        </div>

                        <button id="desktopComputerHotspot" class="computer-click-target desktop-hoverable" type="button" aria-label="Open computer"></button>

                        <div class="computer-laptop" aria-hidden="true">
                            <div class="computer-screen-lid">
                                <div class="computer-screen-bezel">
                                    <div class="computer-screen-content">
                                        <div class="computer-screen-fake-text"></div>
                                    </div>
                                </div>
                            </div>

                            <div class="computer-laptop-base">
                                <div class="computer-banana-logo" aria-hidden="true">
                                    <span class="banana-body"></span>
                                    <span class="banana-leaf"></span>
                                </div>
                                <div class="computer-floppy-slot" aria-hidden="true">
                                    <span class="floppy-slot-notch"></span>
                                </div>
                                <div class="computer-keyboard" aria-hidden="true"></div>
                                <div class="computer-trackpad" aria-hidden="true"></div>
                            </div>
                        </div>

                        <div class="computer-modem" aria-hidden="true">
                            <div class="computer-modem-lights">
                                <span></span>
                                <span></span>
                                <span></span>
                            </div>
                            <div class="computer-modem-vent"></div>
                        </div>
                    </div>
                </div>

                <div id="noticeboardScene" class="noticeboard-scene is-scene-hidden" aria-label="Noticeboard workspace">
                    <div class="noticeboard-brick-wall" aria-hidden="true"></div>
                    <div class="noticeboard-board-frame" aria-hidden="true">
                        <div class="noticeboard-corkboard"></div>
                    </div>
                </div>

                <div id="zoomReadout" class="zoom-readout">Zoom 3/5</div>
            </div>

            <div id="floatingSettings" class="floating-settings" aria-label="Settings menu">
                <button id="settingsToggle" class="settings-toggle" aria-expanded="false" aria-controls="settingsItems" aria-label="Music Settings" title="Music Settings">
                    <span class="settings-cog">♫</span>
                </button>
                <button id="noticeboardButton" class="settings-toggle scene-nav-toggle" aria-label="Go To Noticeboard" title="Go To Noticeboard">
                    <span class="scene-nav-openmoji" aria-hidden="true">&#xE202;</span>
                </button>
                <div id="settingsItems" class="settings-items d-none">
                    <button id="muteToggleButton" class="settings-item settings-toggle-item">Mute: Off</button>
                    <div class="settings-item settings-transport-row">
                        <button id="musicPlayPauseButton" class="settings-transport-button" aria-label="Pause music">⏸</button>
                        <button id="musicNextButton" class="settings-transport-button" aria-label="Next track">⏭</button>
                    </div>
                    <div class="settings-item settings-slider-row">
                        <label id="musicVolumeLabel" for="musicVolumeSlider">Music Volume</label>
                        <input id="musicVolumeSlider" type="range" min="0" max="100" step="1" value="10">
                        <span id="musicVolumeValue" class="settings-value">10%</span>
                    </div>
                    <div class="settings-item settings-slider-row">
                        <label id="sfxVolumeLabel" for="sfxVolumeSlider">SFX Volume</label>
                        <input id="sfxVolumeSlider" type="range" min="0" max="100" step="1" value="85">
                        <span id="sfxVolumeValue" class="settings-value">85%</span>
                    </div>
                </div>
            </div>

            <div id="sceneFadeOverlay" class="scene-fade-overlay" aria-hidden="true"></div>
        </div>
    </div>
    <!--Save Load Game Input Field-->
    <div id="loadSaveGameStringPopup" class="save-load-popup-container bg-dark p-4 rounded shadow-lg d-none">
        <div class="save-load-header-container d-flex justify-content-between align-items-center mb-3">
            <div class="save-load-header">Copy String To A Text File:</div>
            <div class="save-load-buttons-container">
                <button id="loadStringButton"
                    class="save-load-buttons btn btn-success btn-sm flex-grow-1 mr-4">Load</button>
                <button id="copyButtonSavePopup"
                    class="save-load-buttons btn btn-success btn-sm flex-grow-1 mr-4">Copy</button>
                <button id="pasteButtonLoadPopup"
                    class="save-load-buttons btn btn-secondary btn-sm flex-grow-1 mr-4 d-none">Paste</button>
                <button id="closeButtonSavePopup"
                    class="save-load-buttons btn btn-danger btn-sm flex-grow-0">Close</button>
            </div>
        </div>
        <div class="save-load-input-container">
            <textarea id="loadSaveGameStringTextArea" class="save-load-input-field" aria-label=""></textarea>
        </div>
    </div>
    <div id="overlay" class="d-none overlay"></div>
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.4.4/lz-string.min.js"></script>
    <script type="module" src="game.js"></script>
    <script type="module" src="localization.js"></script>
    <script type="module" src="constantsAndGlobalVars.js"></script>
    <script type="module" src="ui.js"></script>
</body>

</html>
